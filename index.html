<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiotis Wishlist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /*DESIGN & ΧΡΩΜΑΤΑ */
        :root {
            --primary-color: #1B4D3E; /* Σκούρο Πράσινο */
            --secondary-color: #F5F5DC; /* Μπεζ */
            --accent-color: #D4AF37; /* Χρυσό */
            --text-color: #333;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--secondary-color); 
            color: var(--text-color);
            padding-bottom: 100px;
        }

        /* Header */
        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 25px 20px;
            text-align: center;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .header h1 { margin: 0; font-size: 26px; letter-spacing: 1px; }
        .table-input {
            padding: 10px; border-radius: 8px; border: none;
            text-align: center; font-weight: bold; font-size: 16px;
            width: 60%; margin-top: 15px; outline: none;
        }

        /* Κατηγορίες */
        .category-title {
            margin: 25px 15px 10px;
            color: var(--primary-color);
            border-left: 5px solid var(--accent-color);
            padding-left: 10px;
            font-size: 20px; text-transform: uppercase; font-weight: 800;
        }

        /* Κάρτα Φαγητού */
        .menu-item {
            background: white;
            margin: 12px 15px;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-item.active-item {
            border-left: 5px solid var(--primary-color);
            background-color: #f0f7f4;
        }
        
        .item-info h3 { margin: 0 0 5px; font-size: 17px; color: #222; }
        .price { color: var(--primary-color); font-weight: bold; font-size: 15px; }

        /* --- ΚΟΥΜΠΙΑ ΠΟΣΟΤΗΤΑΣ (+/-) --- */
        .action-container {
            display: flex; align-items: center;
        }

        /* Το αρχικό κουμπί (+) */
        .btn-add-initial {
            background-color: #eee;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            color: var(--primary-color);
            font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Το χειριστήριο [- 1 +] */
        .qty-control {
            display: none; /* Κρυφό αρχικά */
            align-items: center;
            background-color: var(--primary-color);
            border-radius: 20px;
            padding: 2px;
        }
        .qty-btn {
            background: none; border: none;
            color: white; font-size: 18px; font-weight: bold;
            width: 30px; height: 30px;
            cursor: pointer;
        }
        .qty-num {
            color: white; font-weight: bold; font-size: 16px;
            width: 25px; text-align: center;
        }

        /* Κάτω Μπάρα */
        .bottom-bar {
            position: fixed; bottom: 15px; left: 15px; right: 15px;
            background: var(--primary-color);
            color: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
        }
        .total-info { font-size: 13px; }
        .total-info b { font-size: 18px; color: var(--accent-color); display:block; }
        
        .btn-save {
            background-color: var(--accent-color);
            color: var(--primary-color);
            border: none; padding: 12px 20px;
            border-radius: 12px; font-weight: bold; font-size: 16px;
            cursor: pointer;
        }
        .btn-save:disabled { background-color: #555; color: #aaa; cursor: not-allowed; }

    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-utensils"></i> ΤΑΒΕΡΝΑ ΧΙΩΤΗΣ v2.0</h1>
        <p>Παραδοσιακές Γεύσεις</p>
        <input type="number" id="table-num" class="table-input" placeholder="Αρ. Τραπεζιού" min="1">
    </div>

    <div id="menu-container"></div>

    <div class="bottom-bar">
        <div class="total-info">
            Σύνολο: <b id="total-price">0.00€</b>
            <span id="items-count">0 είδη</span>
        </div>
        <button id="btn-submit" class="btn-save" onclick="submitWishlist()" disabled>
            Αποθήκευση <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <script>
        // --- 1. ΔΕΔΟΜΕΝΑ ---
        const fixedMenu = [
            { category: "🥗 Σαλάτες", items: [
                { id: 101, name: "Σαλάτα Χιώτης", price: 9.00 },
                { id: 102, name: "Χωριάτικη", price: 8.50 },
                { id: 103, name: "Κοτοσαλάτα", price: 9.50 },
                { id: 104, name: "Πράσινη", price: 7.00 },
                { id: 105, name: "Λάχανο-Καρότο", price: 5.00 }
            ]},
            { category: "🧀 Ορεκτικά", items: [
                { id: 201, name: "Τζατζίκι", price: 3.50 },
                { id: 202, name: "Ντακάκια", price: 5.00 },
                { id: 203, name: "Λαχανοντολμάδες", price: 8.00 },
                { id: 204, name: "Σαγανάκι", price: 6.00 },
                { id: 205, name: "Συκώτι Σαβόρε", price: 9.00 }
            ]},
            { category: "🍖 Κυρίως Πιάτα", items: [
                { id: 301, name: "Κοτόπουλο Ψητό", price: 9.50 },
                { id: 302, name: "Πανσέτα Ψητή", price: 9.00 },
                { id: 303, name: "Μπιφτέκια Μοσχ.", price: 10.00 },
                { id: 304, name: "Μπριζολάκια Λαιμού", price: 11.00 },
                { id: 305, name: "Burger Χιώτης", price: 12.00 }
            ]},
            { category: "🍺 Ποτά", items: [
                { id: 401, name: "Coca Cola", price: 2.50 },
                { id: 402, name: "Μπύρα", price: 4.00 },
                { id: 403, name: "Κρασί (500ml)", price: 5.00 },
                { id: 404, name: "Νερό (1L)", price: 1.00 },
                { id: 405, name: "Ρετσίνα", price: 4.50 }
            ]}
        ];

        // Μαγειρευτά (Όπως τα είχαμε)
        const dailySpecialsDB = {
            1: [{id: 901, name: "Φασολάδα", price: 6.00}, {id: 902, name: "Μοσχάρι Κοκκινιστό", price: 12.00}],
            2: [{id: 903, name: "Γεμιστά", price: 8.00}, {id: 904, name: "Κοτόπουλο Φούρνου", price: 9.00}],
            3: [{id: 905, name: "Ρεβύθια", price: 6.00}, {id: 906, name: "Παστίτσιο", price: 10.00}],
            4: [{id: 907, name: "Γιουβαρλάκια", price: 8.00}, {id: 908, name: "Χοιρινό Σελινατο", price: 11.00}],
            5: [{id: 909, name: "Γίγαντες", price: 6.50}, {id: 910, name: "Μπακαλιάρος Σκορδαλιά", price: 12.00}],
            6: [{id: 911, name: "Μουσακάς", price: 10.00}, {id: 912, name: "Αρνάκι Λεμονάτο", price: 13.00}],
            0: [{id: 913, name: "Γουρουνόπουλο", price: 14.00}, {id: 914, name: "Μακαρόνια με κιμά", price: 8.00}]
        };

        // Το καλάθι τώρα θα έχει μορφή: { id: 101, name: "Σαλάτα", price: 9, qty: 2 }
        let wishlist = {}; 

        // --- 2. LOGIC ---

        function renderMenu() {
            const container = document.getElementById("menu-container");
            let html = "";

            // Πιάτα Ημέρας
            const today = new Date().getDay();
            const daysNames = ["Κυριακή", "Δευτέρα", "Τρίτη", "Τετάρτη", "Πέμπτη", "Παρασκευή", "Σάββατο"];
            if (dailySpecialsDB[today]) {
                html += `<h2 class="category-title">🍳 Πιάτα Ημέρας (${daysNames[today]})</h2>`;
                dailySpecialsDB[today].forEach(item => html += createItemHTML(item));
            }

            // Σταθερό Μενού
            fixedMenu.forEach(cat => {
                html += `<h2 class="category-title">${cat.category}</h2>`;
                cat.items.forEach(item => html += createItemHTML(item));
            });

            container.innerHTML = html;
        }

        function createItemHTML(item) {
            return `
            <div class="menu-item" id="card-${item.id}">
                <div class="item-info">
                    <h3>${item.name}</h3>
                    <span class="price">${item.price.toFixed(2)}€</span>
                </div>
                
                <div class="action-container">
                    <button class="btn-add-initial" id="init-btn-${item.id}" onclick="addItem(${item.id}, '${item.name}', ${item.price})">
                        <i class="fas fa-plus"></i>
                    </button>

                    <div class="qty-control" id="qty-ctrl-${item.id}">
                        <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                        <span class="qty-num" id="qty-val-${item.id}">1</span>
                        <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            </div>`;
        }

        // Προσθήκη για πρώτη φορά
        function addItem(id, name, price) {
            wishlist[id] = { name: name, price: price, qty: 1 };
            
            // Αλλαγή UI: Κρύβουμε το (+) και δείχνουμε το [- 1 +]
            document.getElementById(`init-btn-${id}`).style.display = "none";
            document.getElementById(`qty-ctrl-${id}`).style.display = "flex";
            document.getElementById(`card-${id}`).classList.add("active-item");
            
            updateTotal();
        }

        // Αλλαγή ποσότητας (+/-)
        function updateQty(id, change) {
            if (!wishlist[id]) return;

            wishlist[id].qty += change;

            // Αν η ποσότητα πάει στο 0 -> Αφαίρεση
            if (wishlist[id].qty <= 0) {
                delete wishlist[id];
                // Επαναφορά UI στο αρχικό (+)
                document.getElementById(`init-btn-${id}`).style.display = "flex";
                document.getElementById(`qty-ctrl-${id}`).style.display = "none";
                document.getElementById(`card-${id}`).classList.remove("active-item");
            } else {
                // Απλά ενημερώνουμε το νούμερο
                document.getElementById(`qty-val-${id}`).innerText = wishlist[id].qty;
            }
            updateTotal();
        }

        function updateTotal() {
            let totalCost = 0;
            let totalItems = 0;

            for (const id in wishlist) {
                totalCost += wishlist[id].price * wishlist[id].qty;
                totalItems += wishlist[id].qty;
            }

            document.getElementById("total-price").innerText = totalCost.toFixed(2) + "€";
            document.getElementById("items-count").innerText = totalItems + " είδη";
            document.getElementById("btn-submit").disabled = totalItems === 0;
        }

        function submitWishlist() {
            const table = document.getElementById("table-num").value;
            if (!table) {
                alert("⚠️ Παρακαλώ γράψε αριθμό τραπεζιού!");
                document.querySelector('.header').scrollIntoView({ behavior: 'smooth' });
                return;
            }

            const btn = document.getElementById("btn-submit");
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ...';

            // 1. Ετοιμασία της Λίστας (Κείμενο)
            let itemsArray = [];
            for (const id in wishlist) {
                itemsArray.push(`${wishlist[id].name} (x${wishlist[id].qty})`);
            }

            // 2. Ετοιμασία του Συνόλου (Τιμή) - ΤΟ ΠΑΙΡΝΟΥΜΕ ΑΠΟ ΤΗΝ ΟΘΟΝΗ
            const totalStr = document.getElementById("total-price").innerText; // π.χ. "15.50€"

            const dataToSend = {
                table: table,
                items: itemsArray,
                total: totalStr // <--- Στέλνουμε το έτοιμο σύνολο!
            };

            // !!! ΒΑΛΕ ΤΟ LINK ΣΟΥ ΕΔΩ !!!
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzG0aoTF_-tV0kw0B55a1IyDa1q6n4nFmUnKRBDdcjrmC4vBvlx_QxMdJeO3djZgZna/exec";

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST", mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dataToSend)
            })
            .then(() => {
                alert(`✅ Παραγγελία εστάλη!\nΤραπέζι: ${table}`);
                location.reload(); 
            })
            .catch(err => {
                console.error(err);
                alert("❌ Σφάλμα αποστολής");
                btn.disabled = false;
                btn.innerText = "Αποθήκευση";
            });
        }

        // Auto-detect Table from URL
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const tableParam = urlParams.get('table');
            if (tableParam) {
                const input = document.getElementById("table-num");
                input.value = tableParam;
                input.readOnly = true;
                input.style.backgroundColor = "#e8f5e9";
                input.style.color = "#1B4D3E";
            }
            renderMenu();
        };
    </script>
</body>
</html>
